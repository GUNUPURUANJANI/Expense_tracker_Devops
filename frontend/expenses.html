<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside><h2>₹ ExpenseWise</h2><nav><a href="dashboard.html">Dashboard</a><a class="active" href="expenses.html">Expenses</a><a href="reports.html">Reports</a></nav><button id="logoutBtn" class="logout">Logout</button></aside><main><header><div><small>TRANSACTIONS</small><h1>Expenses</h1></div><span id="welcome"></span></header><section class="panel"><h2 id="formTitle">Add an expense</h2><form id="expenseForm" class="fields"><input type="hidden" id="expenseId"><div><label>Name</label><input id="title" required placeholder="Lunch"></div><div><label>Amount (₹)</label><input id="amount" type="number" min=".01" step=".01" required></div><div><label>Category</label><select id="category" required><option value="">Choose</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Education</option><option>Health</option><option>Entertainment</option><option>Other</option></select></div><div><label>Date</label><input id="date" type="date" required></div><div class="wide"><label>Notes</label><input id="notes" maxlength="300"></div><div class="actions"><button id="saveBtn" class="primary">Add expense</button><button id="cancelEdit" type="button" hidden>Cancel</button></div></form><p id="message" class="message"></p></section><section class="panel"><div class="between"><h2>All expenses</h2><input id="monthFilter" type="month"></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Category</th><th>Date</th><th>Amount</th><th>Actions</th></tr></thead><tbody id="expenseRows"></tbody></table></div></section></main></div><script src="js/common.js"></script><script src="js/expenses.js"></script></body></html>
